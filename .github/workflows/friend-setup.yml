name: Friend setup
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'
          cache: pnpm
      - name: Fresh checkout setup without sibling repositories
        run: pnpm setup:friend --skip-desktop
      - name: Exact simulation capacity and recovery
        run: node --test tests/sdk-simulation-connection.test.mjs tests/sdk-publication-preflight.test.mjs tests/sdk-public-simulation-pool.test.mjs tests/sdk-rpc.test.mjs tests/sdk-network-index.test.mjs tests/transaction-gas-policy.test.mjs tests/sdk-release-wallet-batch.test.mjs tests/rpc-publication-simulation.test.mjs
      - name: Native Geth stateful publication validation (synthetic, isolated)
        env:
          KEEL_NATIVE_GETH_EVIDENCE: native-geth-publication-evidence.json
        run: |
          docker pull ethereum/client-go@sha256:abf3605177f8bdcfce436985a8054cca4ae59256323a4ffb72c56c04f3d1fadd
          pnpm verify:publication-native
      - uses: actions/upload-artifact@v4
        with:
          name: native-geth-publication-evidence
          path: native-geth-publication-evidence.json
          if-no-files-found: error
      - name: Record approved public-only HTTPS capacity (not private-plan proof)
        run: node scripts/probe-approved-sepolia-http.mjs
      - name: Record indexed public-only pool qualification (no project data)
        run: node scripts/check-public-simulation-pool.mjs --public-only | tee public-simulation-pool-evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: public-simulation-pool-evidence
          path: public-simulation-pool-evidence.json
          if-no-files-found: error
      - name: Setup and network rejection tests
        run: pnpm setup:test
      - name: MCP and generator preparation
        run: node --test tests/mcp.test.mjs tests/runtime-module-index.test.mjs tests/sdk-inline-viewer-graph.test.mjs tests/sdk-managed-publication.test.mjs tests/sdk-web3-token-json.test.mjs tests/sdk-asset-storage-planner.test.mjs tests/sdk-publication-module.test.mjs tests/sdk-stake-schemas.test.mjs
      - name: Build editor
        run: pnpm --filter @keel/desktop build
      - name: Desktop local tests
        run: pnpm desktop:test
      - name: Pixel generator source tests
        run: pnpm pixel:test
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Local contract publication and exact byte read-back
        run: pnpm sandbox:test
      - name: Setup leaves tracked source unchanged
        run: git diff --exit-code
